name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  lint-typecheck:
    name: Lint + Type-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
  test:
    name: Tests (Node ${{ matrix.node-version }})
    needs: lint-typecheck
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:run
  deploy:
    name: Deploy to GitHub Pages
    needs:
      - lint-typecheck
      - test
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Set build timestamp
        # Uses shell date command instead of github.run_started_at expression,
        # which GitHub Actions evaluates to an empty string for ISO-8601 datetime
        # values in both env: blocks and run steps. The date command produces a
        # plain string that is written to $GITHUB_ENV for the next step.
        run: echo "VITE_BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
        shell: bash
      - run: npm run build
        env:
          VITE_DEPLOY_VERSION: ${{ github.run_number }}
          VITE_COMMIT_SHA: ${{ github.sha }}
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
